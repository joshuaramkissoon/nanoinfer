[package]
name = "nanoinfer-metal"
description = "Metal (Apple GPU) backend for nanoinfer: GPT-2 forward passes hillclimbed one measured stage at a time."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
nanoinfer-core = { path = "../core" }

# Metal only exists on Apple platforms. Elsewhere the crate compiles to an
# empty library so the workspace still builds.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-metal = "0.3"

[dev-dependencies]
serde_json.workspace = true
