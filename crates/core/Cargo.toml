[package]
name = "nanoinfer-core"
description = "A small, readable LLM inference engine (GPT-2). No filesystem, threads or clocks: runs on wasm32-unknown-unknown."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Multithreaded kernels (rayon). Off by default so the wasm32 build stays
# single-threaded and dependency-free; the CLI turns it on.
threads = ["dep:rayon"]

[dependencies]
serde_json.workspace = true
rayon = { version = "1.10", optional = true }
