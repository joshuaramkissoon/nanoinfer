[package]
name = "nanoinfer-cli"
description = "Command-line driver for nanoinfer: generate text and benchmark stages."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "nanoinfer"
path = "src/main.rs"

[dependencies]
nanoinfer-core = { path = "../core", features = ["threads"] }
rayon = "1.10"
serde_json.workspace = true
memmap2 = "0.9"
clap = { version = "4", features = ["derive"] }
nanoinfer-webgpu = { path = "../webgpu" }

[target.'cfg(target_os = "macos")'.dependencies]
nanoinfer-metal = { path = "../metal" }
