[package]
name = "nanoinfer-wasm"
description = "wasm-bindgen facade over nanoinfer-core: the engine that drives the live web visualisations."
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

# Standalone on purpose: not a member of the root workspace, so the native
# hillclimb (crates/core, crates/cli) never has to build wasm bits.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# The threads build (nightly, atomics + bulk-memory, see build.sh): adds the
# browser rung `wasm-threads`, which splits matmuls across Web Workers via
# wasm-bindgen-rayon and a shared wasm heap. Core's own `threads` feature is
# deliberately NOT enabled: its spin pool starts OS threads, which wasm lacks.
threads = ["dep:rayon", "dep:wasm-bindgen-rayon"]
# The WebGPU rungs (crates/webgpu on the browser's WebGPU through wgpu).
webgpu = ["dep:nanoinfer-webgpu", "dep:wasm-bindgen-futures"]

[dependencies]
nanoinfer-core = { path = "../core" }
wasm-bindgen = "=0.2.129"
js-sys = "0.3"
serde_json = "1"
wasm-bindgen-rayon = { version = "1.3", optional = true }
rayon = { version = "1.10", optional = true }
nanoinfer-webgpu = { path = "../webgpu", default-features = false, features = ["web"], optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = false
